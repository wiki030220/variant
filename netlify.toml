# 异见 VARIANT · Netlify 部署配置
# 纯静态站点：无需构建，直接发布仓库根目录
[build]
  publish = "."
  functions = "netlify/functions"

# 基础响应头（可选）
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 后台与首页禁用缓存，保证每次拿到最新版本
[[headers]]
  for = "/cms/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/cms/"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
