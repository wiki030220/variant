backend:
  name: git-gateway
  branch: main

# 本地开发时如需预览后台，取消下行注释并运行 npx decap-server
# local_backend: true

publish_mode: editorial_workflow

# 上传的图片将保存到仓库 assets/uploads 目录
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# 站点品牌（显示在后台左上角）
site_url: https://variant-media.netlify.app
display_url: https://variant-media.netlify.app
logo_url: ""

collections:
  # ============================================================
  # 影像作品
  # ============================================================
  - name: "works"
    label: "影像作品"
    label_singular: "作品"
    icon: "📷"
    description: "首页放映机与作品集使用的摄影作品。保存后自动发布。"
    format: "json"
    files:
      - label: "作品管理"
        name: "works"
        file: "data/works.json"
        fields:
          - label: "作品"
            name: "items"
            widget: "list"
            collapsed: false
            summary: "{{title}}（{{cat}} · {{year}}）"
            fields:
              - { label: "作品图片", name: "src", widget: "image", hint: "上传图片，或粘贴图片链接" }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "英文名（选填）", name: "en", widget: "string", required: false }
              - label: "分类"
                name: "cat"
                widget: "select"
                options: ["人像", "风光", "城市", "建筑", "活动纪实"]
                default: "城市"
              - { label: "拍摄年份", name: "year", widget: "string", hint: "如 2024" }
              - { label: "进首页放映机", name: "featured", widget: "boolean", default: false, hint: "开启后进入首页放映机轮播" }
              - { label: "作品描述（选填）", name: "desc", widget: "text", required: false }
              - { label: "外链（选填）", name: "url", widget: "string", required: false, hint: "点击作品跳转的链接，如 #/article/concrete" }

  # ============================================================
  # 文章（影评 / 书评 / 艺术观察）
  # ============================================================
  - name: "articles"
    label: "文章"
    label_singular: "文章"
    icon: "📝"
    description: "影评 / 书评 / 艺术观察全部文章。"
    format: "json"
    files:
      - label: "文章管理"
        name: "articles"
        file: "data/articles.json"
        fields:
          - label: "文章"
            name: "items"
            widget: "list"
            collapsed: false
            summary: "{{title}} · {{cat}} · {{date}}"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - label: "栏目"
                name: "cat"
                widget: "select"
                options: ["影评", "书评", "艺术观察"]
              - label: "栏目英文标签"
                name: "catEn"
                widget: "select"
                options: ["FILM", "BOOK", "ART"]
                hint: "对应栏目：影评→FILM，书评→BOOK，艺术观察→ART"
              - { label: "发布日期", name: "date", widget: "string", hint: "格式 2026.08.28" }
              - { label: "阅读时长", name: "read", widget: "string", hint: "如 8 min read" }
              - { label: "封面图", name: "cover", widget: "image" }
              - { label: "摘要", name: "excerpt", widget: "text" }
              - { label: "进首页编辑推荐", name: "featured", widget: "boolean", default: false, hint: "开启后进入首页“编辑推荐”精选区" }
              - { label: "文章 ID（一般不改）", name: "id", widget: "string", hint: "用于链接的唯一标识，如 oppenheimer-time" }
              - { label: "链接（一般不改）", name: "url", widget: "string", hint: "点击卡片跳转的地址" }

  # ============================================================
  # 站点配置
  # ============================================================
  - name: "config"
    label: "站点配置"
    label_singular: "站点配置"
    icon: "⚙️"
    description: "品牌、关于、页脚等全站信息。一般只在网站上线初期设置一次。"
    format: "json"
    files:
      - label: "站点设置"
        name: "config"
        file: "data/config.json"
        fields:
          - label: "品牌（网站名 / 搜索框）"
            name: "site"
            widget: "object"
            collapsed: false
            summary: "品牌：{{brand}}"
            fields:
              - { label: "品牌名（中文）", name: "brand", widget: "string", hint: "显示在首页大标题，如 异见" }
              - { label: "品牌名（英文）", name: "brandEn", widget: "string", hint: "如 VARIANT" }
              - { label: "搜索框占位文字", name: "searchPlaceholder", widget: "string", hint: "显示在首页搜索框内的提示文字" }
          - label: "关于页（首页下方）"
            name: "about"
            widget: "object"
            collapsed: false
            summary: "关于：{{title}}"
            fields:
              - { label: "区块标题", name: "title", widget: "string" }
              - { label: "章节编号（一般不改）", name: "secNo", widget: "string", hint: "如 05" }
              - { label: "头像占位文字（可留空）", name: "imagePlaceholderText", widget: "string", required: false, hint: "临时占位，之后替换为真实照片" }
              - { label: "图片说明（可留空）", name: "imageCaption", widget: "string", required: false }
              - { label: "简介小标题", name: "introTitle", widget: "string" }
              - { label: "简介第一段", name: "introText", widget: "text" }
              - { label: "简介第二段", name: "introText2", widget: "text", required: false }
              - label: "摄影理念（列表）"
                name: "philosophy"
                widget: "list"
                collapsed: false
                summary: "{{title}}"
                fields:
                  - { label: "理念标题", name: "title", widget: "string" }
                  - { label: "理念内容", name: "text", widget: "text" }
          - label: "页脚（联系方式）"
            name: "footer"
            widget: "object"
            collapsed: false
            summary: "页脚邮箱：{{email}}"
            fields:
              - { label: "版权文字", name: "copyright", widget: "string" }
              - { label: "邮箱", name: "email", widget: "string" }
              - { label: "微信（选填）", name: "wechat", widget: "string", required: false }
